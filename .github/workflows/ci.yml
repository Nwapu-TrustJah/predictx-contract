name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    # Pinned so a new release never silently changes what CI installs.
    SOROBAN_CLI_VERSION: "22.6.0"
    # A dedicated root rather than $CARGO_HOME, so the prebuilt binary is
    # cached under its own key instead of being tied to the workspace lockfile.
    SOROBAN_CLI_ROOT: $HOME/.soroban-cli

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@1.82.0
              with:
                  toolchain: "1.82.0"
                  target: wasm32-unknown-unknown
                  override: true

            - name: Resolve toolchain version
              id: toolchain
              run: |
                  version=$(rustc --version | cut -d' ' -f2)
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "soroban-cache-key=soroban-cli-${SOROBAN_CLI_VERSION}-${version}-${RUNNER_OS}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"

            # Caches the cargo registry, the cargo git checkouts, the workspace
            # target directory and $CARGO_HOME/bin. The key hashes every
            # Cargo.toml/Cargo.lock, rust-toolchain.toml and the resolved rust
            # version, so it is invalidated by dependency or toolchain changes.
            # cache-on-failure keeps a failed run from re-downloading everything.
            - name: Cache cargo artifacts
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: |
                    . -> target
                  cache-on-failure: true

            # `~` is expanded to $HOME, i.e. the same $SOROBAN_CLI_ROOT above.
            # No restore-keys: falling back to a different CLI version would
            # silently change what CI tests against.
            - name: Restore cached Soroban CLI
              id: soroban-cli-cache
              uses: actions/cache/restore@v4
              with:
                  path: ~/.soroban-cli
                  key: ${{ steps.toolchain.outputs.soroban-cache-key }}

            # Only needed to *compile* soroban-cli: its keyring/secret-service
            # dependency links against libdbus-1 and libudev. Neither the
            # workspace build nor the tests need them, so this is skipped
            # entirely on a cache hit.
            - name: Install system dependencies
              if: steps.soroban-cli-cache.outputs.cache-hit != 'true'
              run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

            - name: Install Soroban CLI
              if: steps.soroban-cli-cache.outputs.cache-hit != 'true'
              run: cargo install --locked soroban-cli --version "$SOROBAN_CLI_VERSION" --root "$SOROBAN_CLI_ROOT"

            # A separate save step rather than a post step on purpose: a plain
            # actions/cache only saves on success(), so a run that fails later
            # in build/test would throw the 6-minute binary away and force the
            # next run to rebuild it. Saving here keeps the cache warm even
            # while a branch is red.
            - name: Save Soroban CLI to cache
              if: steps.soroban-cli-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                  path: ~/.soroban-cli
                  key: ${{ steps.toolchain.outputs.soroban-cache-key }}

            - name: Add Soroban CLI to PATH
              run: echo "$SOROBAN_CLI_ROOT/bin" >> "$GITHUB_PATH"

            - name: Build all contracts (WASM)
              run: cargo build --target wasm32-unknown-unknown --release

            - name: Run tests
              run: cargo test --all -- --nocapture
